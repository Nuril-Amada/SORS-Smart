<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SORS API Docs - Smart Oil Report System</title>
    <meta name="description" content="Dokumentasi API sistem SORS (Smart Oil Report System) - Manajemen Neraca Massa Tangki Minyak Kelapa Sawit." />
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
    <style>
      /* ---- Base Reset ---- */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f1117;
        min-height: 100vh;
      }

      /* ---- Top Header Bar ---- */
      .sors-header {
        background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
        border-bottom: 1px solid rgba(34, 211, 238, 0.2);
        padding: 20px 32px;
        display: flex;
        align-items: center;
        gap: 16px;
        position: sticky;
        top: 0;
        z-index: 999;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      }

      .sors-logo {
        width: 44px;
        height: 44px;
        background: linear-gradient(135deg, #22d3ee, #0ea5e9);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        box-shadow: 0 0 16px rgba(34, 211, 238, 0.4);
        flex-shrink: 0;
      }

      .sors-title-group { flex: 1; }

      .sors-title {
        font-size: 20px;
        font-weight: 700;
        color: #fff;
        letter-spacing: -0.3px;
      }

      .sors-subtitle {
        font-size: 12px;
        color: rgba(34, 211, 238, 0.8);
        margin-top: 2px;
      }

      .sors-badge {
        background: rgba(34, 211, 238, 0.15);
        border: 1px solid rgba(34, 211, 238, 0.3);
        color: #22d3ee;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      /* ---- Swagger UI Override Theme ---- */
      #swagger-ui {
        max-width: 1280px;
        margin: 0 auto;
        padding: 24px 20px 60px;
      }

      .swagger-ui .topbar { display: none !important; }

      .swagger-ui {
        color: #e2e8f0;
      }

      .swagger-ui .info { margin: 0 0 24px; }

      .swagger-ui .info .title {
        color: #f1f5f9;
        font-size: 28px;
        font-weight: 700;
      }

      .swagger-ui .info .description p,
      .swagger-ui .info .description li {
        color: #94a3b8;
        font-size: 14px;
        line-height: 1.7;
      }

      .swagger-ui .scheme-container {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 16px;
        box-shadow: none;
      }

      /* Tag group headers */
      .swagger-ui .opblock-tag {
        background: #1e293b !important;
        border: 1px solid #334155 !important;
        border-radius: 10px !important;
        margin-bottom: 8px !important;
        padding: 14px 20px !important;
        color: #f1f5f9 !important;
        font-size: 16px !important;
        font-weight: 600 !important;
      }

      .swagger-ui .opblock-tag:hover {
        background: #273548 !important;
      }

      /* Operation blocks */
      .swagger-ui .opblock {
        background: #1e293b !important;
        border: 1px solid #334155 !important;
        border-radius: 8px !important;
        margin-bottom: 6px !important;
        box-shadow: none !important;
      }

      .swagger-ui .opblock .opblock-summary {
        border-radius: 8px !important;
        padding: 10px 16px !important;
      }

      .swagger-ui .opblock .opblock-summary-description {
        color: #94a3b8 !important;
        font-size: 13px !important;
      }

      /* Method badge colors */
      .swagger-ui .opblock.opblock-get { border-left: 3px solid #22d3ee !important; }
      .swagger-ui .opblock.opblock-post { border-left: 3px solid #34d399 !important; }
      .swagger-ui .opblock.opblock-put { border-left: 3px solid #fbbf24 !important; }
      .swagger-ui .opblock.opblock-delete { border-left: 3px solid #f87171 !important; }
      .swagger-ui .opblock.opblock-patch { border-left: 3px solid #a78bfa !important; }

      .swagger-ui .opblock-body { background: #0f172a !important; }

      /* Response & example sections */
      .swagger-ui .responses-inner,
      .swagger-ui .opblock-section-header {
        background: #0f172a !important;
      }

      .swagger-ui .opblock-section-header h4 {
        color: #94a3b8 !important;
        font-size: 13px !important;
      }

      .swagger-ui table tbody tr td {
        color: #cbd5e1 !important;
        border-color: #334155 !important;
      }

      .swagger-ui .model-box { background: #1e293b !important; }

      .swagger-ui .model { color: #cbd5e1 !important; }

      .swagger-ui select,
      .swagger-ui input[type=text],
      .swagger-ui textarea {
        background: #1e293b !important;
        border: 1px solid #475569 !important;
        color: #f1f5f9 !important;
        border-radius: 6px !important;
      }

      /* Execute button */
      .swagger-ui .btn.execute {
        background: linear-gradient(135deg, #0ea5e9, #22d3ee) !important;
        border: none !important;
        border-radius: 6px !important;
        color: #fff !important;
        font-weight: 600 !important;
        padding: 8px 20px !important;
      }

      .swagger-ui .btn.execute:hover {
        opacity: 0.85 !important;
      }

      .swagger-ui .btn.cancel {
        border: 1px solid #475569 !important;
        color: #94a3b8 !important;
        border-radius: 6px !important;
      }

      /* Response code badges */
      .swagger-ui .response-col_status { color: #22d3ee !important; font-weight: 700 !important; }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #0f1117; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>

    <!-- SORS Header Bar -->
    <div class="sors-header">
      <div class="sors-logo">🛢️</div>
      <div class="sors-title-group">
        <div class="sors-title">SORS API Documentation</div>
        <div class="sors-subtitle">Smart Oil Report System — Tank Farm Mass Balance API</div>
      </div>
      <div class="sors-badge">v1.0.0</div>
    </div>

    <!-- Swagger UI Container -->
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js"></script>
    <script>
      window.onload = () => {
        SwaggerUIBundle({
          url: "./openapi.json",
          dom_id: "#swagger-ui",
          deepLinking: true,
          presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIStandalonePreset
          ],
          plugins: [SwaggerUIBundle.plugins.DownloadUrl],
          layout: "StandaloneLayout",
          defaultModelsExpandDepth: 1,
          defaultModelExpandDepth: 1,
          docExpansion: "list",
          filter: true,
          syntaxHighlight: {
            activated: true,
            theme: "monokai"
          }
        });
      };
    </script>
  </body>
</html>
