# ============================================================
# SORS - Apache24 VirtualHost Configuration
# File: C:\Apache24\conf\extra\httpd-vhosts.conf
#
# Akses Frontend: http://localhost/sors
# Akses Backend:  http://localhost/sors/api  atau  http://localhost/oilreport/backend
# ============================================================

# ---- Pastikan VirtualHost default localhost tetap berjalan ----
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "C:/Apache24/htdocs"

    <Directory "C:/Apache24/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# ---- SORS Backend API ----
Alias /sors/api "D:/Kerja Praktik/KP SEMESTER 7/oilreport/backend"
Alias /oilreport/backend "D:/Kerja Praktik/KP SEMESTER 7/oilreport/backend"

<Directory "D:/Kerja Praktik/KP SEMESTER 7/oilreport/backend">
    Options Indexes FollowSymLinks MultiViews
    AllowOverride All
    Require all granted
</Directory>

# ---- SORS Frontend (React Web App) ----
Alias /sors "D:/Kerja Praktik/KP SEMESTER 7/oilreport/frontend/dist"

<Directory "D:/Kerja Praktik/KP SEMESTER 7/oilreport/frontend/dist">
    Options Indexes FollowSymLinks MultiViews
    AllowOverride All
    Require all granted

    # Routing SPA React (Fallback ke index.html saat berpindah route/halaman)
    RewriteEngine On
    RewriteBase /sors/
    RewriteRule ^index\.html$ - [L]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /sors/index.html [L]
</Directory>
